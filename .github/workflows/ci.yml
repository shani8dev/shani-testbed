name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    uses: shani8dev/shani-ci-commons/.github/workflows/lint.yml@main
    with:
      language: bash

  python:
    name: Python compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile lib/*.py mcp/*.py

  app-actions:
    name: GUI action layer (real Xvfb + GTK)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: tests/run-app-actions.sh

  harness-tests:
    name: Harness self-tests
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the real cmd_suite / cmd_gate with stubbed steps (summary, step order,
      # identity pinning, .passed only on success)
      - run: tests/suite-summary.sh
      - run: tests/gate-flow.sh
      # serve must refuse a port a previous serve still holds: a stale server
      # keeps answering with ITS docroot, which is indistinguishable from an
      # unreachable feed (found live, cost a long debugging session)
      - run: tests/serve-port-guard.sh
      # update-check is the read-only compatibility shim for the retired
      # `update` command: it must route to shani-deploy --status --check
      # --json and never install, switch a slot, or run the notification agent
      - run: tests/update-check.sh
      # iso-install's in-guest runner against os-installer's contract, in an
      # Arch container (docker is on the runner)
      - run: tests/iso-install-runner.sh

  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      scan-type: secrets
    needs: lint
