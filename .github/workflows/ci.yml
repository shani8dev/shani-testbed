name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    uses: shani8dev/shani-ci-commons/.github/workflows/lint.yml@main
    with:
      language: bash

  python:
    name: Python compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile lib/*.py mcp/*.py

  app-actions:
    name: GUI action layer (real Xvfb + GTK)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: tests/run-app-actions.sh

  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      scan-type: secrets
    needs: lint
